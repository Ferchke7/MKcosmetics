services:
  mkcosmetics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkcosmetics
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3001
      - DB_PATH=/app/data/mkcosmetics.db
      - STATIC_DIR=/app/dist
      - TELEGRAM_CHANNEL=mkcosmetkor
    networks:
      - app-net

  caddy:
    image: caddy:2-alpine
    container_name: mkcosmetics-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mkcosmetics
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
